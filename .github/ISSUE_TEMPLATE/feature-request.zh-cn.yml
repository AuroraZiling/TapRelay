name: 功能建议
description: 提议 TapRelay 相关的功能
title: "[Feat] "
labels:
  - enhancement
type: feature
body:
  - type: checkboxes
    attributes:
      label: 请先使用搜索功能查看该功能是否已被提议过。
      options:
        - label: 我已搜索过重复的 Issue。
          required: true
  - type: textarea
    id: description
    attributes:
      label: 新功能描述
      description: 请详细描述你想要添加的新功能
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 输入你正在使用的版本
      placeholder: 例如 0.1.0
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或补充信息
      description: 可选。说明尝试过的替代方案，或提供相关设备信息。
