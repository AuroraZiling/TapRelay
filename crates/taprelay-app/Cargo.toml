[package]
name = "taprelay-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "taprelay"
path = "src/main.rs"

[dependencies]
taprelay-core.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow = "1.0.104"
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["formatting"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "fmt",
    "json",
    "smallvec",
    "tracing-log",
] }
tracing-appender = "0.2.5"
tempfile = "3.27.0"
lru = { version = "0.19.0", default-features = false }
rust-i18n = "4.2.4"
gpui-kit = "=0.9.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
semver = "1.0.28"
velopack = { version = "=1.2.161", features = ["public-utils"] }

[build-dependencies]
serde_json = "1.0.154"
embed-resource = "3.0.12"

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
time = { version = "0.3.55", features = ["macros"] }
zip = { version = "8.6.0", default-features = false }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
taprelay-windows = { path = "../taprelay-windows" }

[target.'cfg(target_os = "macos")'.dependencies]
taprelay-macos = { path = "../taprelay-macos" }
