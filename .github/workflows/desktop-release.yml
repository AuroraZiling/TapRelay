name: Desktop Release

on:
  push:
    tags: ['v*']

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  VELOPACK_VERSION: '1.2.161'

jobs:
  check:
    name: Check
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/check-workspace

  build:
    name: Windows x64
    runs-on: windows-latest
    environment: windows-signing
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - name: Set release version from tag
        id: version
        shell: python
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          import os, re, subprocess
          from pathlib import Path

          tag = os.environ["TAG_NAME"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit("Release tags must use vX.Y.Z.")
          version = tag[1:]
          manifest = Path("Cargo.toml")
          content, count = re.subn(
              r'(\[workspace\.package\]\s*version\s*=\s*")[^"]+(")',
              lambda m: f'{m[1]}{version}{m[2]}',
              manifest.read_text(encoding="utf-8"),
          )
          if count != 1:
              raise SystemExit("Expected one workspace.package.version in Cargo.toml.")
          manifest.write_text(content, encoding="utf-8")
          subprocess.run(["cargo", "update", "--workspace"], check=True)
          for target, value in [("GITHUB_OUTPUT", f"version={version}"), ("GITHUB_ENV", f"TAPRELAY_VERSION={version}")]:
              with open(os.environ[target], "a", encoding="utf-8") as output:
                  output.write(value + "\n")
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: windows-release
      - run: cargo rustc --release --locked -p taprelay-app -- -C target-feature=+crt-static
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned packaging tools
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet tool install vpk --version $env:VELOPACK_VERSION --tool-path "$env:RUNNER_TEMP/vpk"
          & "$env:RUNNER_TEMP/vpk/vpk" --help --skip-updates
          "$env:RUNNER_TEMP/vpk" >> $env:GITHUB_PATH
          $zip = "$env:RUNNER_TEMP/ssign-windows-x86_64.zip"
          Invoke-WebRequest 'https://github.com/Le-Syl21/ssign/releases/download/v0.1.11/ssign-windows-x86_64.zip' -OutFile $zip
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne '3dacba75082d2949bae332f6dfac342843a85838db75deba9721b40b43fe73f0') {
            throw 'Unexpected ssign archive checksum.'
          }
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP/ssign"
          "TAPRELAY_SSIGN=$env:RUNNER_TEMP/ssign/ssign.exe" >> $env:GITHUB_ENV
      - name: Sign and package Windows release
        shell: pwsh
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
          XDG_RUNTIME_DIR: ${{ runner.temp }}/taprelay-signing
        run: ./scripts/package-windows.ps1 -Version $env:TAPRELAY_VERSION
      - name: Discard signing session
        if: always()
        shell: pwsh
        run: |
          $session = "$env:RUNNER_TEMP/taprelay-signing/ssign/session.json"
          if (Test-Path -LiteralPath $session) { Remove-Item -LiteralPath $session }
      - name: Verify per-user installation and uninstall
        shell: pwsh
        run: ./scripts/test-windows-install.ps1 -SetupPath "release-assets/TapRelay_${env:TAPRELAY_VERSION}_Windows_x64_Setup.exe"
      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/')
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-release
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-26
          - arch: x64
            target: x86_64-apple-darwin
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/check-workspace
      - name: Set release version from tag
        shell: python
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          import os, re, subprocess
          from pathlib import Path
          tag = os.environ["TAG_NAME"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit("Release tags must use vX.Y.Z.")
          version = tag[1:]
          manifest = Path("Cargo.toml")
          content, count = re.subn(
              r'(\[workspace\.package\]\s*version\s*=\s*")[^"]+(")',
              lambda m: f'{m[1]}{version}{m[2]}', manifest.read_text(encoding="utf-8"),
          )
          if count != 1:
              raise SystemExit("Expected one workspace.package.version.")
          manifest.write_text(content, encoding="utf-8")
          subprocess.run(["cargo", "update", "--workspace"], check=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"TAPRELAY_VERSION={version}\n")
      - name: Build release
        run: cargo build --release --locked -p taprelay-app --target "${{ matrix.target }}"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'
      - name: Prepare Velopack
        run: |
          python3 -m unittest discover -s scripts/tests -p test_macos_signing_identity.py
          dotnet tool install vpk --version "$VELOPACK_VERSION" --tool-path "$RUNNER_TEMP/taprelay-vpk"
          "$RUNNER_TEMP/taprelay-vpk/vpk" --help --skip-updates
          echo "$RUNNER_TEMP/taprelay-vpk" >> "$GITHUB_PATH"
      - name: Sign, notarize and package
        id: signing
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          TAPRELAY_TARGET: ${{ matrix.target }}
        run: |
          set +x
          set -euo pipefail
          : "${CERTIFICATE_BASE64:?Missing Developer ID Application and Installer identities}"
          : "${CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${NOTARY_KEY_BASE64:?Missing notary API key}"
          : "${NOTARY_KEY_ID:?Missing notary key ID}"
          : "${NOTARY_ISSUER:?Missing notary issuer}"
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/taprelay-signing.XXXXXX")
          keychain="$signing_dir/taprelay.keychain-db"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$signing_dir"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf 'signing_dir=%s\n' "$signing_dir" >> "$GITHUB_OUTPUT"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$signing_dir/certificate.p12"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$signing_dir/notary.p8"
          unset CERTIFICATE_BASE64 NOTARY_KEY_BASE64
          # GitHub masks the stored Base64 secret, not its decoded PEM lines.
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" ]] || printf '::add-mask::%s\n' "$line"
          done < "$signing_dir/notary.p8"
          unset line
          keychain_password=$(openssl rand -hex 32)
          printf '::add-mask::%s\n' "$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/certificate.p12" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security -t cert -f pkcs12 -k "$keychain"
          unset CERTIFICATE_PASSWORD
          rm -f "$signing_dir/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          unset keychain_password
          # codesign also uses the search list to build the certificate chain.
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          export TAPRELAY_SIGN_KEYCHAIN="$keychain"
          export TAPRELAY_NOTARY_KEYCHAIN="$keychain"
          export TAPRELAY_NOTARY_PROFILE=taprelay-ci
          xcrun notarytool store-credentials "$TAPRELAY_NOTARY_PROFILE" --keychain "$keychain" \
            --key "$signing_dir/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          unset NOTARY_KEY_ID NOTARY_ISSUER
          rm -f "$signing_dir/notary.p8"
          scripts/package-macos.sh --target "$TAPRELAY_TARGET" --release --notarize --skip-build
      - name: Remove signing credentials
        if: ${{ always() && steps.signing.outputs.signing_dir != '' }}
        shell: bash
        env:
          SIGNING_DIR: ${{ steps.signing.outputs.signing_dir }}
        run: |
          set -euo pipefail
          # EXIT handles normal failures; this also runs after step cancellation.
          if [[ ${SIGNING_DIR%/*} != "$RUNNER_TEMP" || ${SIGNING_DIR##*/} != taprelay-signing.* ]]; then
            echo "Unexpected signing directory" >&2
            exit 1
          fi
          security delete-keychain "$SIGNING_DIR/taprelay.keychain-db" >/dev/null 2>&1 || true
          rm -rf "$SIGNING_DIR"
      - name: Upload release package
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-${{ matrix.arch }}-release
          path: |
            artifacts/TapRelay_${{ env.TAPRELAY_VERSION }}_macOS_${{ matrix.arch }}.pkg
            artifacts/releases.osx-${{ matrix.arch }}.json
            artifacts/TapRelay-${{ env.TAPRELAY_VERSION }}-osx-${{ matrix.arch }}-full.nupkg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish
    needs: [check, build, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: node --test scripts/tests/publish-release.test.cjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: macos-arm64-release
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: macos-x64-release
          path: release-assets
      - name: Publish GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        with:
          script: |
            const { publish } = require('./scripts/publish-release.cjs');
            await publish(github, context, process.env.TAG_NAME, process.env.VERSION, 'release-assets');
