[package]
name = "taprelay-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "taprelay"
path = "src/main.rs"

[dependencies]
taprelay-core.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow = "1.0.104"
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "fmt",
    "json",
    "smallvec",
    "tracing-log",
] }
tracing-appender = "0.2.5"
tempfile = "3.27.0"
lru = { version = "0.18.5", default-features = false }
rust-i18n = "4.2.3"
gpui-kit = "=0.7.3"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
serde_json = "1.0.151"
embed-resource = "3.0.11"

[dev-dependencies]
gpui-kit = { version = "=0.7.3", features = ["test-support"] }
time = { version = "0.3.55", features = ["macros"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
taprelay-windows = { path = "../taprelay-windows" }
