name: Windows Release

on:
  push:
    tags: ['v*']

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Check
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SLINT_EMIT_DEBUG_INFO: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-20
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve release version
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG_NAME -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Release tags must use vX.Y.Z.'
          }
          $version = $env:TAG_NAME.Substring(1)
          "version=$version" >> $env:GITHUB_OUTPUT
          "TAPRELAY_VERSION=$version" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-20
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
      - run: cargo rustc --release --locked -p taprelay-app -- -C target-feature=+crt-static
      - name: Package portable ZIP
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          New-Item -ItemType Directory -Path release-package -Force | Out-Null
          Copy-Item -LiteralPath target/release/taprelay.exe -Destination release-package/TapRelay.exe
          Copy-Item -LiteralPath LICENSE -Destination release-package/LICENSE
          Copy-Item -LiteralPath THIRD_PARTY_NOTICES.md -Destination release-package/THIRD_PARTY_NOTICES.md
          $files = @('release-package/TapRelay.exe', 'release-package/LICENSE', 'release-package/THIRD_PARTY_NOTICES.md')
          Compress-Archive -LiteralPath $files -DestinationPath "release-assets/TapRelay_$($env:VERSION)_Windows_x64.zip" -Force
      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/')
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: release-assets/TapRelay_${{ steps.version.outputs.version }}_Windows_x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  release:
    name: Publish
    needs: [check, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-assets
      - name: Publish GitHub Release
        uses: actions/github-script@v8
        env:
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        with:
          script: |
            const fs = require('node:fs');
            const repo = context.repo;
            const tag = process.env.TAG_NAME;
            // Never recreate a tag removed while the build was running.
            let { data: ref } = await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
            let object = ref.object;
            while (object.type === 'tag') {
              const { data } = await github.rest.git.getTag({ ...repo, tag_sha: object.sha });
              object = data.object;
            }
            if (object.type !== 'commit' || object.sha !== context.sha) {
              throw new Error('The tag no longer points to the commit that was built.');
            }
            const name = `TapRelay_${process.env.VERSION}_Windows_x64.zip`;
            const asset = fs.readFileSync(`release-assets/${name}`);
            if (!asset.length) throw new Error('Release ZIP is empty.');
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
              ({ data: release } = await github.rest.repos.createRelease({
                ...repo, tag_name: tag, name: `TapRelay ${tag}`,
                draft: false, prerelease: false, generate_release_notes: true,
              }));
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...repo, release_id: release.id, per_page: 100,
            });
            for (const existing of assets.filter(asset => asset.name === name)) {
              await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: existing.id });
            }
            await github.rest.repos.uploadReleaseAsset({
              ...repo, release_id: release.id, name,
              headers: { 'content-type': 'application/zip', 'content-length': asset.length },
              data: asset,
            });
            core.info(`Published ${name} to ${release.html_url}`);
