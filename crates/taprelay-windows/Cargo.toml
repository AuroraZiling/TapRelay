[package]
name = "taprelay-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
taprelay-core.workspace = true
serde.workspace = true
tracing.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "=0.25.1", default-features = false }
uuid = { version = "1", features = ["v5"] }
windows-future = "0.3.2"
windows-collections = "0.3.2"
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Radios", "Devices_Enumeration", "Foundation", "Storage_Streams", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_System_WinRT", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_System_Registry", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops"] }



